# Builds the Windows installer on GitHub's servers.
# Push a tag like v1.0.1 and the installer is attached to a new Release automatically.
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Keep the installer as a downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: simple-box-windows
          path: dist/*.exe

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
