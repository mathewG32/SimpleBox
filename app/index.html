<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm night workbench for a solo freelancer
   IDEA: a box you open onto a blank table and lay a client's site out on, page by page
   PICTURE: the dotted canvas with page boards, wireframe parts and glowing flow arrows between pages
   COLOUR and TYPE: charcoal ground, cobalt accent for flow, sticky-note brights; Inter Tight + Inter
   LAYOUT: start screen with presets -> canvas: info bar top, tools left, parts drawer, inspector right */
:root{color-scheme:dark;--bg:#0d0f13;--panel:#14171e;--panel2:#1b1f29;--line:#262b37;--line2:#363d4e;--ink:#e8eaf0;--muted:#8d95a8;--acc:#5b8cff;--accd:#3f6ff0;--red:#ff6b6b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
h1,h2,.pname{font-family:"Inter Tight",Inter,system-ui,sans-serif}
button{font:inherit;color:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-height:40px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--line2)}
.primary{background:var(--accd);border-color:var(--accd);color:#fff}.primary:hover{background:var(--acc);border-color:var(--acc)}
.danger{color:var(--red)}.wide{width:100%;margin-top:14px}
.ib{background:none;border:0;color:var(--muted);cursor:pointer;min-width:38px;min-height:38px;border-radius:9px;display:inline-grid;place-items:center;font-size:20px;line-height:1}
.ib:hover{color:var(--ink);background:var(--panel2)}
.ib svg,.tool svg{width:20px;height:20px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #5b8cff33}
textarea{min-height:84px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:13px;margin:10px 0 0}

/* home */
.home{height:100%;overflow:auto;padding:max(6vh,24px) max(4vw,14px) 40px;background:linear-gradient(180deg,#05070bcc 0%,#05070b66 45%,#05070b99 100%),url(wallpaper.webp) center 62%/cover no-repeat #05070b;display:flex;align-items:flex-start;justify-content:center}
#app{height:100%}
.glass{width:min(980px,100%);margin:auto 0;padding:clamp(28px,5vw,52px) clamp(18px,4vw,48px) 22px;background:#0d111a8c;border:1px solid #5b8cff40;border-radius:24px;box-shadow:0 30px 80px #000a,inset 0 1px 0 #ffffff12;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.hero{max-width:640px;margin:0 auto 36px;text-align:center}
.hero>svg{width:84px;height:84px}
.hero h1{font-size:clamp(36px,6vw,52px);line-height:1.05;margin:14px 0 8px}
.hero p{color:var(--muted);font-size:17px;margin:0 0 28px;text-wrap:balance}
.big{font-size:17px;padding:14px 30px;min-height:52px;border-radius:12px;font-weight:600}
.rh{max-width:900px;margin:0 auto 12px;font-size:18px}
.plist{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{position:relative;background:#14171ecc;border:1px solid #ffffff14;border-radius:14px;padding:16px 16px 14px;cursor:pointer}
.pcard:hover{border-color:var(--line2)}
.pt{font-weight:600;font-size:16px;padding-right:34px}
.pm{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-top:12px}
.pcard .del{position:absolute;top:8px;right:8px;font-size:18px}
.pcard .del.arm{color:var(--red);font-size:13px;width:auto;padding:0 10px;background:#ff6b6b1a}
.hfoot{display:flex;gap:16px;justify-content:center;margin-top:28px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:14px;min-height:40px}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.pre{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--bg)}
.pre input{position:absolute;opacity:0;pointer-events:none}
.pre svg{width:100%;height:58px;margin-bottom:6px}
.pre b{font-size:15px}.pre span{font-size:12.5px;color:var(--muted);line-height:1.35}
.pre:has(input:checked){border-color:var(--acc);background:#5b8cff14}
.pre:has(input:focus-visible){outline:2px solid var(--acc)}

/* canvas screen */
#cv{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.fields{display:flex;align-items:center;gap:10px;flex:1;overflow-x:auto;scrollbar-width:none;padding:2px}
.fields::-webkit-scrollbar{display:none}
.pname{flex:0 1 260px;min-width:150px;background:none;border:1px solid transparent;font-size:19px;font-weight:700;padding:6px 8px}
.pname:hover{border-color:var(--line)}
.fld{display:flex;align-items:center;gap:6px;flex:none;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 4px 0 10px}
.fld span{font-size:12px;color:var(--muted);white-space:nowrap}
.fld input{border:0;background:none;padding:7px 6px;font-size:15px;box-shadow:none}
.fld input[data-f=client]{width:150px}.fld input[data-f=budget]{width:90px}.fld input[type=date]{width:150px}
.fld:focus-within{border-color:var(--acc)}
.pill{flex:none;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:99px;padding:6px 12px;white-space:nowrap}
.zoom{display:flex;align-items:center;gap:2px;flex:none}
.zl{background:none;border:0;color:var(--muted);cursor:pointer;min-width:52px;min-height:38px;font-size:13px;font-variant-numeric:tabular-nums;border-radius:8px}
.zl:hover{color:var(--ink);background:var(--panel2)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.mid{display:flex;min-height:0;position:relative}
#tools{width:60px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto;scrollbar-width:none;z-index:5}
.tool{width:44px;height:42px;border-radius:11px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;flex:none}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool.on{background:var(--accd);color:#fff}
.tsep{width:28px;height:1px;background:var(--line);margin:5px 0;flex:none}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);cursor:pointer;flex:none;box-shadow:inset 0 0 0 1px #0004}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
#drawer{position:absolute;left:60px;top:0;bottom:0;width:min(310px,calc(100% - 60px));background:var(--panel);border-right:1px solid var(--line2);box-shadow:12px 0 30px #0006;overflow-y:auto;padding:12px 14px 20px;z-index:4;display:none}
#drawer.show{display:block}
.dtop{display:flex;justify-content:space-between;align-items:center}
.dtop b{font-size:17px;font-family:"Inter Tight",Inter,sans-serif}
.dh{font-size:13px;color:var(--muted);font-weight:600;margin:14px 0 8px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px;border:1px solid var(--line);border-radius:11px;background:var(--bg);cursor:pointer;font-size:13px;color:#c9cdd8}
.dtile:hover{border-color:var(--acc);color:var(--ink)}
.dtile.on{border-color:var(--acc);background:#5b8cff14}
.dtile svg{width:100%;height:62px}
.dtile{touch-action:pan-y;user-select:none;-webkit-user-select:none}
#drawer.ghosting{opacity:.2;pointer-events:none}
.ghost{position:fixed;z-index:90;pointer-events:none;width:130px;padding:8px;background:var(--panel2);border:2px solid var(--acc);border-radius:12px;opacity:.92;transform:translate(-50%,-50%);font-size:12px;text-align:center;box-shadow:0 10px 30px #0008}
.ghost svg{width:100%;height:56px;display:block}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(circle,#2b3142 1.1px,transparent 1.4px);cursor:default}
#stage.pan{cursor:grab}#stage.panning{cursor:grabbing}#stage.draw{cursor:crosshair}
#stage.drop{box-shadow:inset 0 0 0 3px var(--acc)}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.emptyhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:min(400px,90%);pointer-events:none;color:var(--muted)}
.emptyhint h2{color:var(--ink);font-size:24px;margin:0 0 8px}
.emptyhint p{margin:0 0 6px}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--accd);color:#fff;padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;box-shadow:0 6px 20px #0006;white-space:nowrap;pointer-events:none}
kbd{font:12px Inter,sans-serif;background:var(--panel2);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--ink)}
#insp{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 16px 18px;display:none}
#insp.show{display:block}
.ih{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.ih b{font-size:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.swr{display:flex;gap:8px;flex-wrap:wrap}
.iact{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.fo{height:100%;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.35 Inter,system-ui,sans-serif}
.fo.note{color:#15171c;font-weight:500}
.fo .ph{opacity:.45}
.fo.task .tt{font-weight:600;color:#e8eaf0}
.fo.task .tm{font-size:12.5px;color:#8d95a8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo.task.dn .tt{text-decoration:line-through;color:#8d95a8}
.ct{display:flex;width:100%;height:100%;overflow:hidden;line-height:1.2;font-family:Inter,system-ui,sans-serif;overflow-wrap:anywhere;white-space:pre-wrap}
.flow{animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
@media(prefers-reduced-motion:reduce){.flow{animation:none}}
.overlay{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(500px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0008}
.modal h2{margin:0 0 2px;font-size:21px}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}.sp{flex:1}
.dsec{font:700 17px "Inter Tight",Inter,sans-serif;margin:22px 0 2px;padding-top:14px;border-top:1px solid var(--line)}
.dsec:first-of-type{border-top:0;padding-top:0;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 12px;border:1px solid var(--line2);border-radius:99px;font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--accd);border-color:var(--accd);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.pals{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.palb{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 6px;cursor:pointer;font-size:13px;min-height:36px}
.palb:hover{border-color:var(--acc)}.palb i{display:flex}.palb b{width:12px;height:12px;border-radius:50%;margin-left:-3px;border:1.5px solid var(--bg)}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 110px;gap:10px;align-items:center;margin-bottom:6px}
.crow input[type=color]{width:44px;height:38px;padding:2px;border-radius:9px;cursor:pointer}
.crow input[type=color][data-empty]{opacity:.35}
.crow span{font-size:14px;color:#c9cdd8}.crow .hex{font:14px ui-monospace,monospace;padding:7px 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 4px;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--acc)}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 8px;min-height:38px;cursor:pointer;border-radius:9px;user-select:none}
.tog:hover{background:var(--panel2);color:var(--ink)}.tog input{width:17px;height:17px;margin:0;accent-color:var(--acc);cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:10px;z-index:80;transition:opacity .3s;max-width:90vw}
@media(max-width:760px){
 #insp{position:absolute;left:60px;right:0;bottom:0;width:auto;max-height:52%;border-left:0;border-top:1px solid var(--line2);box-shadow:0 -10px 30px #0007;border-radius:14px 14px 0 0;z-index:6}
 .pname{font-size:17px;min-width:130px}
 .zoom .hidem{display:none}
}
</style>
</head>

<script>
{
const KEY='simplebox.v2';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>b<a?a:Math.min(Math.max(v,a),b);
const snapOn=()=>DB.snap!==false&&!ui.alt;
const snap=v=>snapOn()?Math.round(v/10)*10:Math.round(v);
const ACC='#5b8cff';
const COLORS=['#f2c04b','#ff8fb1','#6fb6ff','#5fd6a0','#c49bff','#e8eaf0'];
const MCOL=[...COLORS,ACC];

const STAT=[['todo','To do','#8d95a8'],['doing','Doing','#5b8cff'],['review','Review','#f2c04b'],['done','Done','#3fd6a0']];

const SHAPES=[['rect','Rectangle'],['square','Square'],['circle','Circle'],['triangle','Triangle'],['diamond','Diamond'],['pill','Rounded']];

const NAMES={frame:'Page / section',note:'Sticky note',task:'Task',text:'Text box',arrow:'Arrow',pen:'Drawing',shape:'Shape',image:'Image',link:'Flow arrow'};
const ico=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
 select:ico('<path d="M5 3l14 8-6 2-2 6z"/>'),
 hand:ico('<path d="M8 13V5a1.5 1.5 0 013 0v6M11 11V4a1.5 1.5 0 013 0v7M14 11V5.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6.5 7-3 0-4.5-1.5-6-4l-1.5-2.6a1.5 1.5 0 012.5-1.6L8 15"/>'),
 frame:ico('<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 8h16"/>'),
 shapes:ico('<circle cx="7.5" cy="7.5" r="4"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1"/><path d="M12 13l5 8H7z"/>'),
 text:ico('<path d="M5 6V4h14v2M12 4v16M9 20h6"/>'),
 note:ico('<path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/>'),
 task:ico('<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7.5 12l3 3 6-6"/>'),
 arrow:ico('<path d="M5 19L19 5M10 5h9v9"/>'),
 link:ico('<rect x="2" y="7" width="6" height="10" rx="1.5"/><rect x="16" y="7" width="6" height="10" rx="1.5"/><path d="M8 12h7M12.5 9.5L15 12l-2.5 2.5"/>'),
 pen:ico('<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/>'),
 image:ico('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/>'),
 comps:ico('<rect x="3" y="3" width="18" height="5" rx="1"/><rect x="3" y="10" width="8" height="11" rx="1"/><rect x="13" y="10" width="8" height="5" rx="1"/><rect x="13" y="17" width="8" height="4" rx="1"/>'),
 home:ico('<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/>'),
 undo:ico('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>'),
 redo:ico('<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/>'),
 fit:ico('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'),
 details:ico('<circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2a10 10 0 000 20c1.4 0 2-1 2-2 0-1.5-1-1.8-1-3 0-1 .8-2 2-2h2a5 5 0 005-5c0-4.4-4.5-8-10-8z"/>'),
 export:ico('<rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h2M8 12h8M8 16h5"/>')};
const LOGO=`<svg viewBox="0 0 32 32"><path d="M16 3 28 9.5v13L16 29 4 22.5v-13z" fill="#3f6ff0"/><path d="M16 3 28 9.5 16 16 4 9.5z" fill="#7aa2ff"/><path d="M16 16v13L4 22.5v-13z" fill="#2a54c9"/></svg>`;
const TOOLS=[['select','Select','V'],['hand','Pan','H'],['frame','Page / section','F'],['shapes','Shapes','S'],['text','Text box','T'],['note','Sticky note','N'],['task','Task','K'],['arrow','Arrow','A'],['link','Flow arrow (link pages)','L'],['pen','Pen','P'],['image','Image','I'],['comps','Components','C']];

/* ---------- wireframe components ---------- */
const COMP={
 header:{n:'Header',g:'Website',full:'top',h:f=>f.w<600?60:84,label:'Brand'},
 hero:{n:'Hero',g:'Website',full:'stack',h:f=>f.w<600?380:520,label:'Big headline that says what you do'},
 features:{n:'Features',g:'Website',full:'stack',h:f=>f.w<700?520:300,label:'Why choose us'},
 pricing:{n:'Pricing',g:'Website',full:'stack',h:f=>f.w<700?640:420,label:'Pricing'},
 gallery:{n:'Gallery',g:'Website',full:'stack',h:()=>420,label:'Our work'},
 footer:{n:'Footer',g:'Website',full:'bottom',h:f=>f.w<700?180:220,label:'© 2026 Brand'},
 textblock:{n:'Text block',g:'Content',w:420,h:180,label:'Section heading'},
 card:{n:'Card',g:'Content',w:280,h:320,label:'Card title'},
 button:{n:'Button',g:'Content',w:180,h:52,label:'Get started'},
 image:{n:'Image spot',g:'Content',w:360,h:240,label:''},
 video:{n:'Video',g:'Content',w:420,h:240,label:''},
 form:{n:'Contact form',g:'Content',w:380,h:420,label:'Contact us'},
 input:{n:'Input field',g:'Content',w:320,h:72,label:'Email'},
 search:{n:'Search bar',g:'Content',w:340,h:48,label:'Search…'},
 map:{n:'Map',g:'Content',w:420,h:260,label:''},
 statusbar:{n:'Status bar',g:'Mobile & app',full:'top0',h:()=>34,label:'9:41'},
 mobilenav:{n:'Mobile nav',g:'Mobile & app',full:'top',h:()=>56,label:'Brand'},
 tabbar:{n:'Tab bar',g:'Mobile & app',full:'bottom',h:()=>72,label:''},
 list:{n:'List',g:'Mobile & app',w:340,h:256,label:''}};
const WF={bg:'#171b25',bg2:'#1d2230',line:'#3a4255',b1:'#262d3d',b2:'#39415a',txt:'#d3d7e0',mut:'#8d95a8'};
const R=(x,y,w,h,f,o='')=>`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${o}/>`;

  return `<g pointer-events="none"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#f2c04b" stroke="#0d0f13" stroke-width="${2/k}"/><path d="M${cx-r*.45} ${cy-r*.3}h${r*.9}M${cx-r*.45} ${cy+r*.15}h${r*.6}" stroke="#15171c" stroke-width="${1.8/k}" stroke-linecap="round"/></g>`}).join('')}

  $('#hint').style.display=p.items.length?'none':'';
}
function frameAt(x,y){return P().items.filter(i=>i.type==='frame').sort((a,b)=>a.w*a.h-b.w*b.h).find(f=>x>=f.x&&x<=f.x+f.w&&y>=f.y&&y<=f.y+f.h)||null}

  for(let n=its.length-1;n>=0;n--){const b=bbox(its[n]);if(w.x>=b.x&&w.x<=b.x+b.w&&w.y>=b.y&&w.y<=b.y+b.h)return its[n]}

function targetFrame(){const s=find(ui.sel);if(s){if(s.type==='frame')return s;if(s.type!=='link'){const b=bbox(s),f=frameAt(b.x+b.w/2,b.y+b.h/2);if(f)return f}}const c=viewCenter();return frameAt(c.x,c.y)}

/* ---------- history ---------- */
function snapshot(){past.push(JSON.stringify(P().items));if(past.length>60)past.shift();future=[]}

function undo(){const p=P();if(!past.length)return;future.push(JSON.stringify(p.items));p.items=JSON.parse(past.pop());ui.sel=null;refresh()}
function redo(){const p=P();if(!future.length)return;past.push(JSON.stringify(p.items));p.items=JSON.parse(future.pop());ui.sel=null;refresh()}
function removeItem(p,i){p.items=p.items.filter(o=>o!==i&&!(o.type==='link'&&(o.from===i.id||o.to===i.id)))}

/* ---------- drawer ---------- */

function openDrawer(k){ui.drawer=ui.drawer===k?null:k;renderDrawer();setTool(ui.tool)}

/* ---------- inspector ---------- */

const swatches=(i,cols)=>`<label class="l">Color</label><div class="swr">${cols.map(c=>`<button class="sw ${i.color===c?'on':''}" style="--c:${c}" data-act="icolor" data-id="${c}" aria-label="Color ${c}"></button>`).join('')}</div>`;
const SIZES=[['','Custom'],['390x844','Phone · 390 × 844'],['820x1180','Tablet · 820 × 1180'],['1440x1024','Desktop · 1440 × 1024']];

  if(i.type==='frame'){f=fi('title','Name',i.title)+fs('device','Type',[['','Section (dashed box)'],['phone','Phone page'],['desktop','Desktop page']],i.device||'')+fs('_size','Size',SIZES,SIZES.some(s=>s[0]===`${i.w}x${i.h}`)?`${i.w}x${i.h}`:'')+goto+(i.device?'':swatches(i,COLORS))+
    `<button class="btn primary wide" data-act="nextPage">Add next page →</button>`}

  if(i.type==='note')f=fa('text','Note',i.text)+swatches(i,COLORS)+goto;
  if(i.type==='task')f=fi('title','Task',i.title)+fa('notes','Details',i.notes)+`<div class="row"><div>${fs('status','Status',STAT,i.status)}</div><div>${fs('tag','Type',TAGS,i.tag)}</div></div>`+fi('due','Due date',i.due,'date');

      if(k==='goto'){p.items=p.items.filter(x=>!(x.type==='link'&&x.from===i.id));if(v)addLink(p,i,find(v),'');save();draw();return}
      if(k==='_size'){if(v){const[w,h]=v.split('x').map(Number);i.w=w;i.h=h}}
      else if(k==='size')i.size=+v;else if(k==='fill')i.fill=v==='1';

      save();draw();updProg()});
  });
  if(focus){const n=el.querySelector('input[data-k],textarea[data-k]');if(n){n.focus();if(n.select)n.select()}}
}

/* ---------- images & paste ---------- */
function readImage(file,cb){
  if(!file||!file.type.startsWith('image/'))return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
    const m=1200,s=Math.min(1,m/Math.max(img.width,img.height));let url=r.result;
    if(s<1||file.size>350000){const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      url=c.toDataURL('image/webp',.82);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',.82)}
    cb(url,img.width*s,img.height*s)};img.onerror=()=>toast('Couldn’t read that image');img.src=r.result};r.readAsDataURL(file);
}
function addImage(file,at){readImage(file,(src,iw,ih)=>{
  const p=P();if(!p)return;snapshot();const f=at?frameAt(at.x,at.y):targetFrame(),c=at||viewCenter();
  const w=Math.min(iw,f?f.w-40:480,480),h=w*ih/iw;let x=snap(c.x-w/2),y=snap(c.y-h/2);
  if(f&&!at){x=clamp(x,f.x+20,f.x+f.w-w-20);y=clamp(y,f.y+20,f.y+f.h-h-20)}
  const it={id:uid(),type:'image',src,x,y,w,h,ar:iw/ih};p.items.push(it);
  if(!save()){p.items.pop();past.pop();return}
  ui.sel=it.id;setTool('select');draw();renderInsp();ensureVisible(it);draw();
})}
function addText(t){const p=P();snapshot();const c=viewCenter(),ls=t.split('\n'),w=Math.min(520,Math.max(160,Math.max(...ls.map(l=>l.length))*10)),h=Math.max(40,ls.length*24+10);

/* ---------- stage input ---------- */
function bindStage(){
  const st=$('#stage');const ptrs=new Map();let act=null;
  const rect=()=>st.getBoundingClientRect();
  const toW=e=>{const r=rect();return{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k}};
  const pinchInfo=()=>{const[a,b]=[...ptrs.values()],r=rect();return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2-r.left,cy:(a.y+b.y)/2-r.top}};
  const finishLink=(fromId,to)=>{const p=P(),from=find(fromId);if(!from||!to||to.id===from.id)return false;snapshot();const l=addLink(p,from,to,'');ui.sel=l.id;ui.linkFrom=null;ui.snapFor=l.id;setTool(ui.tool==='link'?'link':'select');refresh();renderInsp(true);return true};

    if(ptrs.size===2){const q=pinchInfo();ui.temp=null;act={mode:'pinch',d0:q.d,k0:V.k,wx:(q.cx-V.x)/V.k,wy:(q.cy-V.y)/V.k};return}
    if(ptrs.size>2)return;

    if(h&&h.dataset.h==='link'){act={mode:'linkdrag',from:ui.sel,moved:false};return}
    if(t==='link'){const src=hitAt(w);
      if(ui.linkFrom){if(src&&src.id!==ui.linkFrom){finishLink(ui.linkFrom,src)}else{ui.linkFrom=null;banner();draw()}return}
      if(!src){act={mode:'pan',sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y};st.classList.add('panning');return}
      act={mode:'linkdrag',from:src.id,moved:false};return}
    if(e.button===1||t==='hand'||ui.space||(t==='select'&&!h&&!g)){
      if(t==='select'&&!h&&!g&&!ui.space){setSel(null);draw()}
      act={mode:'pan',sx:e.clientX,sy:e.clientY,vx:V.x,vy:V.y};st.classList.add('panning');return}
    if(t==='select'){
      snapshot();
      if(h){act={mode:h.dataset.h,id:ui.sel}}
      else{const it=find(g.dataset.id);setSel(it.id);
        if(it.type==='link'){past.pop();act=null;draw();return}
        const kids=it.type==='frame'?p.items.filter(o=>{if(o===it||o.type==='link')return false;const b=bbox(o);
          if(o.type==='frame')return b.x>=it.x&&b.y>=it.y&&b.x+b.w<=it.x+it.w&&b.y+b.h<=it.y+it.h;
          const cx=b.x+b.w/2,cy=b.y+b.h/2;return cx>it.x&&cx<it.x+it.w&&cy>it.y&&cy<it.y+it.h}).map(o=>({o,orig:JSON.parse(JSON.stringify(o))})):[];
        act={mode:'move',id:it.id,sx:w.x,sy:w.y,orig:JSON.parse(JSON.stringify(it)),ob:bbox(it),kids,skip:new Set([it.id,...kids.map(k=>k.o.id)])}}
      act.moved=false;draw();return}
    snapshot();
    const c=ui.color,sx=snap(w.x),sy=snap(w.y);let it;
    if(t==='frame'){it={id:uid(),type:'frame',x:sx,y:sy,w:0,h:0,title:'Section',color:c};act={mode:'draw',id:it.id,sx,sy}}
    if(t==='shape'){it={id:uid(),type:'shape',kind:ui.shapeKind,x:sx,y:sy,w:0,h:0,label:'',fill:false,color:c};act={mode:'draw',id:it.id,sx,sy}}
    if(t==='text'){it={id:uid(),type:'text',x:sx,y:sy,w:0,h:0,text:'',size:18,color:'#e8eaf0'};act={mode:'draw',id:it.id,sx,sy}}
    if(t==='arrow'){it={id:uid(),type:'arrow',x:sx,y:sy,x2:sx,y2:sy,color:c};act={mode:'b',id:it.id,isNew:1}}
    if(t==='pen'){it={id:uid(),type:'pen',points:[[Math.round(w.x),Math.round(w.y)]],color:c};act={mode:'pen',id:it.id}}
    if(t==='note')it={id:uid(),type:'note',x:sx-90,y:sy-70,w:180,h:150,text:'',color:c};
    if(t==='task')it={id:uid(),type:'task',x:sx-120,y:sy-45,w:240,h:90,title:'',notes:'',status:'todo',tag:'',due:''};
    if(!it){past.pop();return}
    p.items.push(it);ui.sel=it.id;ui.snapFor=it.id;
    if(!act){setTool('select');save();draw();renderInsp(true);updProg()}else draw();
  });
  st.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(!act)return;
    if(act.mode==='pinch'){if(ptrs.size<2)return;const q=pinchInfo();V.k=Math.max(.1,Math.min(3,act.k0*q.d/act.d0));V.x=q.cx-act.wx*V.k;V.y=q.cy-act.wy*V.k;applyView();draw();return}
    if(act.mode==='pan'){V.x=act.vx+e.clientX-act.sx;V.y=act.vy+e.clientY-act.sy;applyView();return}

      const a=anchor(b,w);ui.temp={x1:a.x,y1:a.y,x2:w.x,y2:w.y};draw();return}

      if(snapOn()){const nb={x:act.ob.x+dx,y:act.ob.y+dy,w:act.ob.w,h:act.ob.h},r=smart(nb,act.skip);if(r.bx)dx+=r.bx.d;if(r.by)dy+=r.by.d;nb.x=act.ob.x+dx;nb.y=act.ob.y+dy;guidesFor(nb,r)}
      const mv=(o,g)=>{if(o.type==='pen')o.points=g.points.map(q=>[q[0]+dx,q[1]+dy]);else{o.x=g.x+dx;o.y=g.y+dy;if(o.type==='arrow'){o.x2=g.x2+dx;o.y2=g.y2+dy}}};
      mv(i,act.orig);act.kids.forEach(k=>mv(k.o,k.orig))}
    else if(act.mode==='se'){const mw=i.type==='task'?160:30,mh=i.type==='task'?70:20;i.w=Math.max(mw,snap(w.x)-i.x);i.h=Math.max(mh,snap(w.y)-i.y);
      if(snapOn()&&i.type!=='image'){const r=smart({x:i.x,y:i.y,w:i.w,h:i.h},new Set([i.id]),true);if(r.bx)i.w+=r.bx.d;if(r.by)i.h+=r.by.d;guidesFor({x:i.x,y:i.y,w:i.w,h:i.h},r)}
      if(i.type==='image')i.h=i.w/(i.ar||1);
      if(i.type==='shape'&&(i.kind==='square'||i.kind==='circle')){const s=Math.max(i.w,i.h);i.w=i.h=s}}
    else if(act.mode==='a'){i.x=snap(w.x);i.y=snap(w.y)}
    else if(act.mode==='b'){i.x2=snap(w.x);i.y2=snap(w.y)}
    else if(act.mode==='draw'){const x=snap(w.x),y=snap(w.y);i.x=Math.min(act.sx,x);i.y=Math.min(act.sy,y);i.w=Math.abs(x-act.sx);i.h=Math.abs(y-act.sy);
      if(i.type==='shape'&&(i.kind==='square'||i.kind==='circle')){const s=Math.max(i.w,i.h);i.w=i.h=s}}
    else if(act.mode==='pen'){const l=i.points[i.points.length-1];if(Math.hypot(w.x-l[0],w.y-l[1])>3/V.k)i.points.push([Math.round(w.x),Math.round(w.y)])}
    draw();
  });

    ptrs.delete(e.pointerId);st.classList.remove('panning');if(ui.guides&&ui.guides.length){ui.guides=[];draw()}ui.alt=false;
    if(!act)return;

    if(act.mode==='pan'){act=null;saveView();return}
    if(act.mode==='linkdrag'){const a=act;act=null;ui.temp=null;
      const tgt=hitAt(toW(e));
      if(a.moved&&tgt&&tgt.id!==a.from&&finishLink(a.from,tgt))return;
      if(!a.moved&&ui.tool==='link'){ui.linkFrom=a.from;banner()}
      else if(!a.moved){ui.linkFrom=a.from;setTool('link');ui.linkFrom=a.from;banner()}

    const p=P(),i=find(act.id);let drop=false,created=false;
    if(i&&act.mode==='draw'){created=true;
      if(i.w<16&&i.h<16){const d=i.type==='frame'?[600,400]:i.type==='text'?[260,60]:SHAPE_DEF[i.kind]||[160,100];i.w=d[0];i.h=d[1];i.x=snap(act.sx-d[0]/2);i.y=snap(act.sy-d[1]/2)}

    if(i&&act.isNew){created=true;if(Math.hypot(i.x2-i.x,i.y2-i.y)<20)drop=true}

  snapshot();let it;
  if(act==='addComp')it=addComp(p,id,frameAt(w.x,w.y),{at:w});
  else{const[dw,dh]=SHAPE_DEF[id];it={id:uid(),type:'shape',kind:id,x:snap(w.x-dw/2),y:snap(w.y-dh/2),w:dw,h:dh,label:'',fill:false,color:ui.color};p.items.push(it)}

    const g=document.createElement('div');g.className='ghost';g.innerHTML=dnd.t.innerHTML;document.body.appendChild(g);dnd.g=g;$('#drawer')?.classList.add('ghosting')}

});
const dndEnd=e=>{
  if(!dnd||e.pointerId!==dnd.pid)return;const d=dnd;dnd=null;if(!d.on)return;
  d.g.remove();swallow=Date.now();const dr=$('#drawer');if(dr){dr.classList.remove('ghosting');ui.drawer=null;renderDrawer();setTool(ui.tool)}
  const st=$('#stage');if(!st||e.type==='pointercancel')return;const r=st.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
  dropAt(d.act,d.id,{x:(e.clientX-r.left-V.x)/V.k,y:(e.clientY-r.top-V.y)/V.k});
};

/* ---------- export for Claude ---------- */
function exportText(p,withJson){
  const b=p.brief||{},c=b.colors||{},L=[],one=s=>String(s||'').replace(/\s*\n\s*/g,' / ').trim(),q=s=>`"${one(s)}"`;
  const R2=n=>Math.round(n);
  L.push(`# ${p.name} — Simple Box wireframe`,`Exported ${new Date().toLocaleString()} from Simple Box, a wireframe planner. Sizes are in px. "@x,y" is the position from the top-left corner of the page it sits on.`);
  L.push('','## Client & job',`- Client: ${p.client||'not set'}`,`- Deadline: ${p.deadline||'not set'}`,`- Budget: ${p.budget?'$'+p.budget:'not set'}`);
  L.push('','## Look & feel',`- Vibe: ${(b.vibe||[]).length?b.vibe.join(', '):'not set'}`);
  const cs=CROLES.filter(([k])=>c[k]).map(([k,l])=>`${l.replace(/ \(.*\)/,'')} ${c[k]}`);
  L.push(`- Colors: ${cs.length?cs.join(' · '):'not set'}`,`- Fonts: headings ${b.headingFont&&b.headingFont!=='Not sure yet'?b.headingFont:'not set'}, body ${b.bodyFont&&b.bodyFont!=='Not sure yet'?b.bodyFont:'not set'}`,
    `- Corners: ${(CORNERS.find(x=>x[0]===b.corners)||[,'not set'])[1].toLowerCase()}`,`- Imagery: ${(b.imagery||[]).length?b.imagery.join(', '):'not set'}`);
  const job=JOB.filter(([k])=>String(b[k]||'').trim());
  if(job.length){L.push('','## The job');job.forEach(([k,l])=>L.push(`- ${l.replace(/ \(.*\)/,'').replace('?','')}: ${one(b[k])}`))}
  const frames=p.items.filter(i=>i.type==='frame'),links=p.items.filter(i=>i.type==='link');
  const owner=i=>{const bb=bbox(i),cx=bb.x+bb.w/2,cy=bb.y+bb.h/2;return frames.filter(f=>f!==i&&cx>=f.x&&cx<=f.x+f.w&&cy>=f.y&&cy<=f.y+f.h&&f.w*f.h>bb.w*bb.h).sort((a,z)=>a.w*a.h-z.w*z.h)[0]||null};
  const own=new Map();p.items.filter(i=>i.type!=='link').forEach(i=>own.set(i.id,owner(i)));
  const order=(a,z)=>Math.abs(a.y-z.y)>40?a.y-z.y:a.x-z.x;
  const pos=i=>{const bb=bbox(i);return bb};
  const nm=i=>!i?'(deleted)':i.type==='frame'?`"${i.title||'Untitled'}"`:i.type==='comp'?COMP[i.kind].n+(i.label?' '+q(i.label):''):i.type==='shape'?((SHAPES.find(s=>s[0]===i.kind)||[,'Shape'])[1])+(i.label?' '+q(i.label):''):i.type==='text'?'Text '+q(i.text):i.type==='note'?'Sticky note '+q(i.text):NAMES[i.type];
  const outs=i=>links.filter(l=>l.from===i.id).map(l=>` → GOES TO ${nm(find(l.to))}${l.label?` (${one(l.label)})`:''}`).join('');
  const desc=(i,f)=>{const bb=pos(i),ox=f?f.x:0,oy=f?f.y:0,at=`@${R2(bb.x-ox)},${R2(bb.y-oy)}`,full=f&&Math.abs(i.w-f.w)<2,sz=full?`full width × ${R2(i.h)}`:`${R2(bb.w)}×${R2(bb.h)}`;let s;
    switch(i.type){
     case 'comp':s=`${COMP[i.kind].n}${i.label?': '+q(i.label):''} — ${sz} ${at}`;break;
     case 'shape':s=`${(SHAPES.find(x=>x[0]===i.kind)||[,'Shape'])[1]} shape${i.label?' '+q(i.label):''} — ${i.fill?'filled':'outline'} ${i.color}, ${sz} ${at}`;break;
     case 'text':s=`Text ${q(i.text)} — ${i.size}px, ${sz} ${at}`;break;
     case 'note':s=`Sticky note: ${q(i.text)} ${at}`;break;
     case 'image':s=`Image (uploaded picture, not included) — ${sz} ${at}`;break;
     case 'task':s=`Task: ${q(i.title||'New task')} [${(STAT.find(x=>x[0]===i.status)||STAT[0])[1]}]`;break;
     case 'arrow':s=`Arrow from ${R2(i.x-ox)},${R2(i.y-oy)} to ${R2(i.x2-ox)},${R2(i.y2-oy)}`;break;
     case 'pen':s=`Freehand drawing — ${sz} ${at}`;break;
     case 'frame':s=`${i.device?(i.device==='phone'?'Phone page':'Desktop page'):'Section'} "${i.title||'Untitled'}" — ${sz} ${at}`;break;
     default:s=NAMES[i.type]||i.type}
    return s+outs(i)+(i.notes&&i.type!=='task'&&String(i.notes).trim()?` — NOTES: ${one(i.notes)}`:'')};
  const kids=f=>p.items.filter(i=>i.type!=='link'&&own.get(i.id)===f).sort((a,z)=>order(pos(a),pos(z)));
  const list=(f,ind)=>kids(f).forEach((i,n)=>{L.push(`${ind}${n+1}. ${desc(i,f)}`);if(i.type==='frame')list(i,ind+'   ')});
  const tops=frames.filter(f=>!own.get(f.id)).sort(order);
  L.push('',`## Pages and sections (${tops.length}), in canvas order`);
  if(!tops.length)L.push('No pages yet.');
  tops.forEach((f,n)=>{L.push('',`### ${n+1}. ${f.title||'Untitled'} — ${f.device?(f.device==='phone'?'phone page':'desktop page'):'section'}, ${R2(f.w)}×${R2(f.h)}${outs(f)}`);
    if(f.notes&&String(f.notes).trim())L.push(`Page notes: ${one(f.notes)}`);
    if(kids(f).length){L.push('Top to bottom:');list(f,'')}else L.push('(empty)')});
  const loose=kids(null).filter(i=>i.type!=='frame');
  if(loose.length){L.push('','## On the canvas, not inside a page');loose.forEach((i,n)=>L.push(`${n+1}. ${desc(i,null)}`))}
  L.push('','## Flow (where each button or page leads)');
  if(!links.length)L.push('No flow arrows yet.');
  links.forEach(l=>{const a=find(l.from),z=find(l.to),pg=a&&a.type!=='frame'&&own.get(a.id);L.push(`- ${nm(a)}${pg?` on ${nm(pg)}`:''} → ${nm(z)}${l.label?` (${one(l.label)})`:''}`)});
  const tasks=p.items.filter(i=>i.type==='task');
  if(tasks.length){L.push('','## Tasks');tasks.forEach(t=>{const tg=TAGS.find(x=>x[0]===t.tag);L.push(`- [${t.status==='done'?'x':' '}] ${one(t.title)||'New task'} — ${(STAT.find(x=>x[0]===t.status)||STAT[0])[1]}${t.due?', due '+t.due:''}${t.tag&&tg?', '+tg[1]:''}${t.notes?'. '+one(t.notes):''}`)})}
  if(withJson){const items=p.items.map(i=>i.type==='image'?{...i,src:'[image not included]'}:i);
    L.push('','## Raw data (for an exact rebuild)','```json',JSON.stringify({name:p.name,client:p.client,deadline:p.deadline,budget:p.budget,brief:p.brief||{},items}),'```')}
  return L.join('\n');
}
function nativeBtn(f,label,name,get){const N=window.simpleBox;if(!N||!N.saveFile)return;const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=label;

function openExport(p){
  modal('Copy for Claude',`<p class="muted" style="margin:4px 0 0">A plain-text spec of this project: style, every page top to bottom, where each button goes, and your notes. Paste it into a chat with Claude.</p>
  <label class="chk"><input type="checkbox" id="ex-json"> Also include raw data (longer, for an exact rebuild)</label>
  <textarea id="ex-t" readonly style="min-height:260px;font:12.5px/1.45 ui-monospace,monospace;margin-top:6px"></textarea>`,{noFocus:true,mount:f=>{

/* ---------- modal ---------- */
function modal(title,body,o={}){
  const m=$('#modal');

  const f=$('#mf'),close=()=>{m.innerHTML=''};
  f.addEventListener('submit',e=>{e.preventDefault();if(o.onSave(Object.fromEntries(new FormData(f)))!==false)close()});

  switch(a){

    {saveText:'Open canvas',onSave:d=>{if(!d.name.trim())return false;const np={id:uid(),name:d.name.trim(),client:d.client.trim(),deadline:'',budget:'',items:[],view:{x:80,y:80,k:1},updated:Date.now()};
      buildPreset(np,d.preset);DB.projects.push(np);ui.pid=np.id;save();openProject(np.id,d.preset!=='blank')}});break;

  case 'closeDrawer':ui.drawer=null;renderDrawer();setTool(ui.tool);break;

  case 'icolor':if(i){snapshot();i.color=id;refresh()}break;

    const pages=p.items.filter(x=>x.type==='frame'&&x.device).length;n.title='Page '+(pages+1);n.x=i.x+i.w+(i.w<600?170:260);
    const hits=()=>p.items.some(o=>o.type==='frame'&&o!==n&&o.x<n.x+n.w&&o.x+o.w>n.x&&o.y<n.y+n.h&&o.y+o.h>n.y);let guard=0;while(hits()&&guard++<40)n.x+=n.w+170;
    p.items.push(n);const dx=n.x-i.x,dy=n.y-i.y;

    addLink(p,i,n,'Next');ui.sel=n.id;ui.snapFor=null;refresh();ensureVisible(n);draw()}break;

  case 'details':openDetails(p);break;
  case 'export':openExport(p);break;
  case 'backup':{const json=JSON.stringify(DB);modal('Backup',`<p class="muted" style="margin:6px 0 0">Your projects save in this browser only. Copy this text and keep it somewhere safe, or paste it into Restore on another device. Images make it long.</p><textarea readonly style="min-height:200px;font:12px/1.4 ui-monospace,monospace;margin-top:12px">${esc(json)}</textarea>`,{noFocus:true,mount:f=>{const b=document.createElement('button');b.type='button';b.className='btn primary';b.textContent='Copy backup';b.onclick=()=>copy(json,'Backup copied');f.querySelector('.actions').appendChild(b);nativeBtn(f,'Save to file','simple-box-backup.json',()=>json)}});break}
  case 'restore':modal('Restore',`<p class="muted" style="margin:6px 0 0">Paste a backup or pick a .json file. This replaces the projects here.</p><label class="l" for="m-json">Backup text</label><textarea id="m-json" name="json"></textarea><label class="l" for="m-file">Or a file</label><input id="m-file" type="file" accept=".json,application/json">`,
    {saveText:'Restore',mount:f=>{f.querySelector('#m-file').addEventListener('change',ev=>{const fl=ev.target.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{f.querySelector('#m-json').value=r.result};r.readAsText(fl)})},
     onSave:d=>{try{const s=JSON.parse(d.json);if(!Array.isArray(s.projects))throw 0;s.projects.forEach(x=>{x.items=Array.isArray(x.items)?x.items:[];x.id=x.id||uid();x.name=x.name||'Untitled'});DB=s;save();renderHome();toast('Restored')}catch(err){toast('That backup didn’t look right');return false}}});break;
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal').innerHTML){$('#modal').innerHTML='';return}if(ui.pid){document.activeElement.blur();ui.drawer=null;renderDrawer();ui.linkFrom=null;setTool(ui.tool==='link'||ui.tool==='shape'?'select':ui.tool);setSel(null);draw()}return}
  if(!ui.pid||$('#modal').innerHTML)return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&k==='y'){e.preventDefault();redo();return}
  if(mod&&k==='d'){e.preventDefault();document.querySelector('[data-act=dup]')?.click();return}
  if(e.key===' '){ui.space=true;$('#stage').classList.add('pan');e.preventDefault();return}
  if((e.key==='Delete'||e.key==='Backspace')&&ui.sel){document.querySelector('[data-act=del]')?.click();return}
  if(mod)return;
  const t=TOOLS.find(x=>x[2].toLowerCase()===k);if(t)document.querySelector(`.tool[data-id="${t[0]}"]`)?.click();
});
document.addEventListener('keyup',e=>{if(e.key===' '&&ui.pid){ui.space=false;setTool(ui.tool)}});
document.addEventListener('paste',e=>{
  if(!ui.pid||$('#modal').innerHTML||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const its=[...(e.clipboardData?.items||[])],img=its.find(x=>x.type.startsWith('image/'));
  if(img){e.preventDefault();addImage(img.getAsFile());return}
  const t=e.clipboardData?.getData('text/plain');if(t&&t.trim()){e.preventDefault();addText(t.trim())}
});

renderHome();
}
</script>
</body>
</html>
